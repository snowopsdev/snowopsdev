name: Profile card

on:
  schedule:
    - cron: "41 5 * * *"  # daily, before refresh-labels (06:17) to avoid push races
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_svg.py, card/art/**]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render SVG cards
        env:
          # Default token reads public data. For private-repo commits/LOC, add a
          # classic PAT (repo, read:user) as the ACCESS_TOKEN secret instead.
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_svg.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card/svg card/stats.json
          git diff --cached --quiet || git commit -m "Update profile card"
          git pull --rebase -q && git push
